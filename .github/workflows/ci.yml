name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ci-dummy
      REDIS_URL: fake://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -m 'not docker'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t day12-chat:ci .

  deploy:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Trigger deployment
        run: |
          if [ -n "$RAILWAY_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --request POST "$RAILWAY_DEPLOY_HOOK"
          else
            echo "Deployment skipped: RAILWAY_DEPLOY_HOOK is not configured."
          fi
      - name: Smoke test
        run: |
          if [ -n "$PUBLIC_URL" ]; then
            sleep 10
            curl --fail --silent --show-error "${PUBLIC_URL%/}/healthz"
          else
            echo "Smoke test skipped: PUBLIC_URL is not configured."
          fi
